# Production topology contract. The factory work order mounts this product's
# Azure Files share at /data (deploy.data_dir). SQLite and generated keys live
# directly there, so a revision restart uses the same ledger and keys. Keep
# exactly one replica while the ledger uses SQLite.
template:
  scale:
    minReplicas: 1
    maxReplicas: 1
  containers:
    - name: app
      volumeMounts:
        - volumeName: data
          mountPath: /data
      env:
        - name: PORT
          value: "8080"
  volumes:
    - name: data
      storageType: AzureFile
      storageName: class-capacity-truth-data
